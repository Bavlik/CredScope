schema_version: 1
id: gha-malformed-workflow
title: A job's steps field is a scalar instead of a list
description: >
  The workflow is valid YAML but structurally invalid GitHub Actions syntax:
  a job's `steps` field is a bare scalar instead of a sequence. CredScope
  must fail closed with a controlled, field-specific structural error.
category: github-actions
inputs:
  repository: repository
config:
  profile: auto
expect:
  result: error
  error_contains: "steps must be a list"
covers:
  rules: []
  evidence: []
  edges: []
tags: [github-actions, negative-control, malformed-input]
forbidden_output_strings: []
notes: >
  This is a controlled-error case: expect.result is "error", so no
  expected.json or expected.sarif golden files are present.
