schema_version: 1
id: gitleaks-multiple-and-duplicate-findings
title: Multiple distinct findings plus one finding reported twice
description: >
  Four Gitleaks JSON entries describe three distinct credentials: two unique
  findings (A, B) and a third finding (C) that Gitleaks reported twice with
  byte-identical fields, as real scanners sometimes do on re-scan. Verifies
  that distinct findings all surface independently and that an exact
  duplicate report collapses to a single credential instead of inflating the
  result.
category: gitleaks
inputs:
  repository: repository
  gitleaks: input/gitleaks.json
config:
  profile: auto
expect:
  result: success
covers:
  rules: [CRD101]
  evidence: [confirmed_static_data_flow]
  edges: []
tags: [gitleaks, deduplication, determinism]
forbidden_output_strings:
  - CREDSCOPE_TEST_CANARY_GITLEAKS_MULTI_A
  - CREDSCOPE_TEST_CANARY_GITLEAKS_MULTI_B
  - CREDSCOPE_TEST_CANARY_GITLEAKS_MULTI_C
notes: ""
