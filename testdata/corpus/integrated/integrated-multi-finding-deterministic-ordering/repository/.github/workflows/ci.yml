name: Multi-finding CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ALPHA_TOKEN: ${{ secrets.ALPHA_TOKEN }}
      BETA_TOKEN: ${{ secrets.BETA_TOKEN }}
    steps:
      - name: Use both tokens
        run: echo "using $ALPHA_TOKEN and $BETA_TOKEN"
