schema_version: 1
id: integrated-allowlist-ignore-config
title: Configured allowlist suppresses a finding and a variable under production
description: >
  A repository has two Gitleaks findings and a workflow referencing two
  variables. .credscope.yml sets profile to production and declares two
  reasoned ignore entries: one suppressing the "test-fixture-finding" rule
  ID entirely, one suppressing the STAGING_DEBUG_TOKEN variable name as a
  known false positive. A third credential, ACTIVE_PROD_TOKEN, is covered by
  neither entry and must still be fully analyzed under the production
  profile. Exercises configuration-driven suppression together with a
  non-default profile in one case.
category: integrated
inputs:
  repository: repository
  gitleaks: input/gitleaks.json
config:
  config_file: config/.credscope.yml
expect:
  result: success
covers:
  rules: [CRD101, CRD102, CRD203]
  evidence: [confirmed_static_data_flow]
  edges: [configured_in, referenced_by_process]
tags: [integrated, allowlist, ignore-configuration, profile]
forbidden_output_strings:
  - CREDSCOPE_TEST_CANARY_INTEGRATED_ALLOWLIST_IGNORED
  - CREDSCOPE_TEST_CANARY_INTEGRATED_ALLOWLIST_ACTIVE
notes: ""
