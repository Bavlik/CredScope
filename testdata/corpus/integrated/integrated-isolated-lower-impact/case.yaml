schema_version: 1
id: integrated-isolated-lower-impact
title: Imported finding confined to an isolated, unpublished local service
description: >
  A Gitleaks finding's Key matches a variable used by a single Compose
  service with no published ports, on an internal-only network, analyzed
  under the local profile. This is the contrast case against
  integrated-gitleaks-actions-higher-impact and
  integrated-gitleaks-compose-published: identical mechanics, much less
  static context and a risk-reducing profile.
category: integrated
inputs:
  repository: repository
  gitleaks: input/gitleaks.json
config:
  profile: local
expect:
  result: success
covers:
  rules: [CRD101, CRD301]
  evidence: [confirmed_static_data_flow]
  edges: [available_to_service]
tags: [integrated, gitleaks, compose, lower-impact, contrast-control]
forbidden_output_strings:
  - CREDSCOPE_TEST_CANARY_INTEGRATED_ISOLATED_001
notes: ""
