title = "CredScope repository secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic Gitleaks input fixtures used to verify immediate redaction"
paths = [
  '''^testdata/vulnerable/gitleaks\.json$''',
]

[[allowlists]]
description = "Generated secret-safe examples contain irreversible SHA-256 fingerprint fields"
targetRules = ["generic-api-key"]
paths = [
  '''^docs/examples/credscope-report\.json$''',
  '''^docs/examples/credscope\.sarif$''',
]

[[allowlists]]
description = "Synthetic test-corpus canaries only: requires BOTH a testdata/corpus/ path AND the exact CREDSCOPE_TEST_CANARY_ namespace, never a path-only match"
condition = "AND"
paths = [
  '''^testdata/corpus/''',
]
regexes = [
  '''CREDSCOPE_TEST_CANARY_[A-Z0-9_]+''',
]

[[allowlists]]
description = "Git-ignored local toolchains, build outputs, and temporary reports are never release inputs"
paths = [
  '''^\.tools/''',
  '''^\.tmp-build/''',
  '''^\.tmp-reports/''',
  '''^dist/''',
  '''^testdata/vulnerable/\.tmp/''',
  '''^testdata/vulnerable/phase6/''',
]

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Generated corpus golden outputs contain irreversible SHA-256 identifiers only"
  condition = "AND"
  paths = [
    '''^testdata/corpus/.*/expected\.(json|sarif)$''',
  ]
  regexes = [
    '''^[a-f0-9]{64}$''',
  ]
