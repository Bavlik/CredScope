name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

jobs:
  validate:
    name: Validate tagged release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout and tag target
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          tag_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          test "${tag_commit}" = "${GITHUB_SHA}"

      - name: Validate tag and VERSION consistency
        shell: bash
        run: |
          version="$(sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' VERSION)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a plain semantic version without a leading v" >&2
            exit 1
          fi
          expected_tag="v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "release tag '${GITHUB_REF_NAME}' does not match VERSION '${version}'; expected '${expected_tag}'" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download modules
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

  publish:
    name: Publish tagged release
    needs: validate
    runs-on: ubuntu-latest
    # Write access to repository contents is required only for creating the
    # GitHub Release and uploading artifacts with GitHub's built-in token.
    permissions:
      contents: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout and tag target before publication
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          tag_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          test "${tag_commit}" = "${GITHUB_SHA}"

      - name: Revalidate tag and VERSION consistency
        shell: bash
        run: |
          version="$(sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' VERSION)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a plain semantic version without a leading v" >&2
            exit 1
          fi
          expected_tag="v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "release tag '${GITHUB_REF_NAME}' does not match VERSION '${version}'; expected '${expected_tag}'" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set reproducible release metadata
        shell: bash
        run: |
          commit_timestamp="$(git show -s --format=%ct "${GITHUB_SHA}")"
          echo "CREDSCOPE_BUILD_TIMESTAMP=${commit_timestamp}" >> "${GITHUB_ENV}"
          echo "CREDSCOPE_BUILD_COMMIT=${GITHUB_SHA}" >> "${GITHUB_ENV}"
          echo "BUILD_DATE=$(date -u -d "@${commit_timestamp}" +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_ENV}"

      - name: Verify Cloudsmith publishing configuration
        shell: bash
        run: |
          if [ -z "${CLOUDSMITH_REPOSITORY}" ]; then
            echo "the CLOUDSMITH_REPOSITORY repository variable is not set; configure it (expected value: credscope) before publishing" >&2
            exit 1
          fi
          if [ -z "${CLOUDSMITH_API_KEY}" ]; then
            echo "the CLOUDSMITH_API_KEY secret is not set; add it before publishing" >&2
            exit 1
          fi
        env:
          CLOUDSMITH_REPOSITORY: ${{ vars.CLOUDSMITH_REPOSITORY }}
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}

      - name: Build and publish release artifacts
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Debian packages were produced
        shell: bash
        run: |
          shopt -s nullglob
          packages=(dist/*.deb)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "no .deb packages were found in dist/; GoReleaser nfpms output is required before publishing" >&2
            exit 1
          fi

      - name: Set up Python for Cloudsmith CLI
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Cloudsmith CLI
        shell: bash
        run: python3 -m pip install --no-cache-dir "cloudsmith-cli==1.19.0"

      - name: Publish Debian packages to Cloudsmith
        shell: bash
        run: |
          shopt -s nullglob
          packages=(dist/*.deb)

          for package in "${packages[@]}"; do
            echo "Publishing ${package} to bavlik/${CLOUDSMITH_REPOSITORY}/any-distro/any-version"
            cloudsmith push deb \
              "bavlik/${CLOUDSMITH_REPOSITORY}/any-distro/any-version" \
              "$package"
          done
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          CLOUDSMITH_REPOSITORY: ${{ vars.CLOUDSMITH_REPOSITORY }}