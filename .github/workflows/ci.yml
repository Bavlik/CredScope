name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

jobs:
  quality:
    name: Quality and race tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Validate release version
        shell: bash
        run: |
          version="$(sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' VERSION)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a plain semantic version without a leading v" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Run unit and integration tests
        run: go test -count=1 ./...

      - name: Run race detector
        run: go test -race -count=1 ./...

      - name: Run vet
        run: go vet ./...

      - name: Verify modules
        run: go mod verify

      - name: Check patches
        run: git diff --check

      - name: Build CLI
        run: |
          mkdir -p .tmp-build
          go build -trimpath -o .tmp-build/credscope ./cmd/credscope

      - name: Verify release metadata injection
        run: |
          test_version="v${VERSION}-test"
          go build -trimpath -ldflags "-X main.version=${test_version} -X main.commit=0123456789abcdef -X main.date=2026-01-02T03:04:05Z" -o .tmp-build/credscope-versioned ./cmd/credscope
          expected="CredScope ${test_version}"$'\nby Bavlik\ncommit: 0123456789abcdef\nbuilt: 2026-01-02T03:04:05Z'
          test "$(.tmp-build/credscope-versioned version)" = "$expected"

      - name: Validate PowerShell script syntax
        shell: pwsh
        run: |
          $failed = $false
          foreach ($path in Get-ChildItem -LiteralPath scripts -Filter '*.ps1' -File) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($path.Name): $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Reject tracked release binaries and archives
        shell: bash
        run: |
          tracked="$(git ls-files | grep -Ei '\.(exe|msi|msix|zip|tar\.gz)$|(^|/)checksums\.txt$' || true)"
          if [[ -n "$tracked" ]]; then
            echo "generated release artifacts must not be tracked:" >&2
            echo "$tracked" >&2
            exit 1
          fi

      - name: Smoke test CLI and reports
        run: |
          mkdir -p .tmp-reports
          .tmp-build/credscope version
          .tmp-build/credscope rules list >/dev/null
          .tmp-build/credscope scan testdata/vulnerable --gitleaks-report gitleaks.json --format terminal --no-color >/dev/null
          .tmp-build/credscope scan testdata/vulnerable --gitleaks-report gitleaks.json --format json >.tmp-reports/credscope.json
          .tmp-build/credscope scan testdata/vulnerable --gitleaks-report gitleaks.json --format json >.tmp-reports/credscope-repeat.json
          .tmp-build/credscope scan testdata/vulnerable --gitleaks-report gitleaks.json --format sarif >.tmp-reports/credscope.sarif
          .tmp-build/credscope scan testdata/vulnerable --gitleaks-report gitleaks.json --format html >.tmp-reports/credscope.html
          .tmp-build/credscope scan testdata/vulnerable --gitleaks-report gitleaks.json --format mermaid >.tmp-reports/blast-radius.md
          go run ./scripts/verify-reports.go .tmp-reports

      - name: Check deterministic security data
        run: go test -count=2 ./internal/analysis ./internal/graph ./internal/reporters/...

      - name: Check generated reports for raw synthetic values
        run: |
          raw_one='FAKE_RAW_''SECRET_FOR_TESTS_ONLY'
          raw_two='DEMO_DATABASE_PASSWORD_''VALUE_FOR_TESTS_ONLY'
          if grep -R -F -e "$raw_one" -e "$raw_two" .tmp-reports; then
            echo 'raw synthetic value found in generated reports' >&2
            exit 1
          fi

  platform-smoke:
    name: Native build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build
        run: go build -trimpath -o credscope${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/credscope
      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: ./credscope version
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\credscope.exe version

  cross-build:
    name: Compile ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Compile
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p .tmp-build
          go build -trimpath -o .tmp-build/credscope-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/credscope

  release-snapshot:
    name: GoReleaser snapshot
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set deterministic snapshot metadata
        shell: bash
        run: |
          version="$(sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' VERSION)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a plain semantic version without a leading v" >&2
            exit 1
          fi
          commit_timestamp="$(git show -s --format=%ct HEAD)"
          echo "VERSION=${version}" >> "${GITHUB_ENV}"
          echo "CREDSCOPE_BUILD_TIMESTAMP=${commit_timestamp}" >> "${GITHUB_ENV}"
          echo "CREDSCOPE_BUILD_COMMIT=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"
          echo "CREDSCOPE_SNAPSHOT_VERSION=${version}-ci" >> "${GITHUB_ENV}"
          echo "BUILD_DATE=$(date -u -d "@${commit_timestamp}" +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_ENV}"

      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.0
          args: check

      - name: Build GoReleaser snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --snapshot --clean

      - name: Verify portable archives extract into one directory
        shell: bash
        run: |
          verify_unsafe_paths() {
            local label="$1" entries="$2"
            if echo "$entries" | grep -E '(^|/)(testdata|docs/examples)(/|$)'; then
              echo "unsafe fixture or generated report included in $label" >&2
              exit 1
            fi
          }

          for architecture in amd64 arm64; do
            dir="credscope_${CREDSCOPE_SNAPSHOT_VERSION}_windows_${architecture}"
            archive="dist/${dir}.zip"
            test -f "$archive"
            entries="$(unzip -Z1 "$archive")"
            echo "$entries" | grep -Fx "${dir}/credscope.exe"
            echo "$entries" | grep -Fx "${dir}/LICENSE"
            echo "$entries" | grep -Fx "${dir}/README.md"
            echo "$entries" | grep -Fx "${dir}/SECURITY.md"
            verify_unsafe_paths "$archive" "$entries"
          done

          for os in linux darwin; do
            for architecture in amd64 arm64; do
              dir="credscope_${CREDSCOPE_SNAPSHOT_VERSION}_${os}_${architecture}"
              archive="dist/${dir}.tar.gz"
              test -f "$archive"
              entries="$(tar -tzf "$archive")"
              echo "$entries" | grep -Fx "${dir}/credscope"
              echo "$entries" | grep -Fx "${dir}/LICENSE"
              echo "$entries" | grep -Fx "${dir}/README.md"
              echo "$entries" | grep -Fx "${dir}/SECURITY.md"
              verify_unsafe_paths "$archive" "$entries"
            done
          done

          test -f dist/checksums.txt

      - name: Verify Debian packages
        shell: bash
        run: |
          for architecture in amd64 arm64; do
            deb="dist/credscope_${CREDSCOPE_SNAPSHOT_VERSION}_${architecture}.deb"
            test -f "$deb"

            echo "--- dpkg-deb --info ${deb} ---"
            dpkg-deb --info "$deb"

            echo "--- dpkg-deb --contents ${deb} ---"
            contents="$(dpkg-deb --contents "$deb")"
            echo "$contents"

            binary_line="$(echo "$contents" | grep -E '\./usr/bin/credscope$')"
            test -n "$binary_line"
            echo "$binary_line" | grep -Eq '^-rwx' || {
              echo "/usr/bin/credscope is not executable in $deb" >&2
              exit 1
            }

            echo "$contents" | grep -Fq './usr/share/doc/credscope/LICENSE'
            echo "$contents" | grep -Fq './usr/share/doc/credscope/README.md'

            if echo "$contents" | grep -E '(^|/)(testdata|docs/examples)(/|$)'; then
              echo "unsafe fixture or generated report included in $deb" >&2
              exit 1
            fi
            if echo "$contents" | grep -Ei '\.env$|credentials|gitleaks\.json|/reports/'; then
              echo "credential-like or generated report file included in $deb" >&2
              exit 1
            fi
          done
